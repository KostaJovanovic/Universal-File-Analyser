[package]
name = "analyser"
version = "0.1.0"
description = "On-device forensic file analyser"
authors = ["Kosta Jovanovic"]
edition = "2021"
rust-version = "1.77.2"

# The library the desktop `main.rs` and the mobile entry point both call into.
[lib]
name = "analyser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The auto-updater is desktop-only (no mobile support in the plugin), so scope the
# dependency to desktop targets to match the #[cfg(desktop)] usage in lib.rs.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# Smaller, faster release binaries (Tauri's recommended profile).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
