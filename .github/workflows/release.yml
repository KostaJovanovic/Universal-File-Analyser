# Build + publish a cross-platform native release on every push to main.
#
# What it does per push:
#   * derives the app version from the WEBSITE's versioning source of truth
#     (COMMIT_COUNT / RELEASE_COMMITS in web/assets/js/core/app.js) via
#     tools/native-version.mjs, so desktop/mobile releases carry the same version
#     the site shows. The site renders "6.10"; semver needs MAJOR.MINOR.PATCH with
#     no leading zeros, so that maps to "6.10.0" (position in the minor slot, a
#     trailing .0 added; valid, monotonic - see tools/native-version.mjs).
#   * builds signed installers for Windows, macOS (Apple Silicon + Intel) and
#     Linux via tauri-action, plus a sideloadable Android APK,
#   * publishes them to a GitHub Release tagged v<version>, together with the
#     signed `latest.json` the in-app desktop auto-updater reads.
#
# Manual prerequisites (one time): add repo secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the minisign key that matches the pubkey in
# native/src-tauri/tauri.conf.json). See research/NATIVE-APP-PLAN.md.
#
# Version uniqueness: the version tracks COMMIT_COUNT, which save.bat bumps on every
# commit, so each pushed commit is a distinct, increasing version. Re-running the
# workflow on the same commit (workflow_dispatch) re-uses the tag and updates that
# release rather than making a new one.
#
# Cost note: this runs a full matrix on EVERY main push. To cut CI minutes, either
# narrow the trigger (add `paths:` to build only when `native/**` or `web/**`
# change) or switch to tag-triggered releases (`on: push: tags: ['v*']`).

name: release

# PAUSED: native releases are not built on push for now. Re-enable by
# uncommenting the `push` trigger below. Until then the workflow only runs when
# started manually (Actions tab -> release -> Run workflow).
on:
  # push:
  #   branches: [main]
  workflow_dispatch: {}

# One release build at a time per branch; a newer push cancels an in-flight one
# so rapid pushes don't pile up or collide on the release tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Compute the version once, from the website's source of truth, and share it
  # with every build + labelling job so they all agree.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          v="$(node tools/native-version.mjs)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "app version = $v"

  release:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust_targets: ''
          - platform: macos-latest      # Apple Silicon
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: macos-latest      # Intel
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Cache the Rust build so only changed crates recompile between pushes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target

      # Cache the ~120 MB of CDN WASM that build-dist.mjs vendors, keyed on the
      # script (its pinned URLs), so it's downloaded once, not every run.
      - name: Cache vendored WASM
        uses: actions/cache@v4
        with:
          path: native/.native-cache
          key: native-wasm-${{ hashFiles('native/build-dist.mjs') }}

      - name: Install Tauri CLI
        working-directory: native
        run: npm ci

      - name: Stamp version to match the website
        shell: bash
        working-directory: native
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const p='src-tauri/tauri.conf.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(p));j.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('version =',j.version)"

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: native
          tagName: v__VERSION__
          releaseName: 'Analyser v__VERSION__'
          releaseBody: 'Automated build. Installed desktop apps auto-update to this release.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Build a sideloadable Android APK and attach it to the same release. Uses a
  # debug-signed APK (signed with the standard Android debug keystore) so it
  # installs from "unknown sources" with no keystore secret to manage; switch to
  # a release-signed APK later if you publish to a store. Runs after the desktop
  # release exists so it can upload straight into it.
  android:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      NDK_VERSION: '26.3.11579264'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target

      - name: Cache vendored WASM
        uses: actions/cache@v4
        with:
          path: native/.native-cache
          key: native-wasm-${{ hashFiles('native/build-dist.mjs') }}

      - name: Install Tauri CLI
        working-directory: native
        run: npm ci

      - name: Stamp version to match the website
        shell: bash
        working-directory: native
        run: |
          node -e "const p='src-tauri/tauri.conf.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(p));j.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('version =',j.version)"

      - name: Initialise the Android project
        working-directory: native
        run: npm run tauri android init -- --ci

      - name: Build Android APK (debug-signed, sideloadable)
        working-directory: native
        run: npm run tauri android build -- --apk --debug

      - name: Upload APK to the release
        shell: bash
        working-directory: native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="$(find src-tauri/gen/android -name '*universal*.apk' | head -n1)"
          if [ -z "$apk" ]; then apk="$(find src-tauri/gen/android -name '*.apk' | head -n1)"; fi
          if [ -z "$apk" ]; then echo 'No APK produced' >&2; exit 1; fi
          out="Analyser-${APP_VERSION}-android.apk"
          cp "$apk" "$out"
          gh release upload "v${APP_VERSION}" "$out" --clobber -R "${GITHUB_REPOSITORY}"

  # Tidy the release so it carries only what a user needs, cleanly named. Runs once,
  # after every platform has uploaded (single job = no races); non-fatal, so a hiccup
  # here never fails the release. Three passes:
  #   1. Delete every standalone *.sig - the updater reads each signature INLINE from
  #      latest.json, so the loose .sig files are pure redundancy on the release page.
  #   2. Rename the desktop installers to Analyser_<Platform>_V<version>_<arch>, and
  #      label the two macOS auto-update payloads *_auto-update.app.tar.gz so nobody
  #      downloads them instead of the .dmg.
  #   3. Reconcile latest.json: every payload the updater fetches (the two
  #      .app.tar.gz, plus deb/rpm) was just renamed, so rewrite its URL in the
  #      manifest to match. Without this the auto-updater would 404. The .dmg is
  #      install-only and never appears in latest.json, so renaming it is free.
  # The Android APK is already uploaded with its final name, so it's left alone.
  tidy-release:
    needs: [version, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Drop signatures, friendly-name installers, reconcile updater manifest
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -u
          list() { gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | [.id, .name] | @tsv'; }

          # 1. Delete every standalone signature (redundant; sigs live inline in latest.json).
          while IFS=$'\t' read -r id name; do
            case "$name" in
              *.sig) gh api -X DELETE "repos/$REPO/releases/assets/$id" \
                       && echo "deleted $name" || echo "delete-fail $name" ;;
            esac
          done <<< "$(list)"

          # 2. Rename installers + macOS updater payloads. Record each rename in RENAMES
          #    so the identical old->new map can be replayed into latest.json in step 3.
          declare -A RENAMES
          while IFS=$'\t' read -r id name; do
            case "$name" in
              *aarch64.app.tar.gz)                new="Analyser_Mac_V${VER}_arm64_auto-update.app.tar.gz" ;;
              *x64.app.tar.gz|*x86_64.app.tar.gz) new="Analyser_Mac_V${VER}_x64_auto-update.app.tar.gz" ;;
              *aarch64.dmg|*arm64.dmg)            new="Analyser_Mac_V${VER}_arm64.dmg" ;;
              *x64.dmg|*x86_64.dmg)               new="Analyser_Mac_V${VER}_x64.dmg" ;;
              *amd64.deb|*x86_64.deb)             new="Analyser_Linux_V${VER}_x64.deb" ;;
              *x86_64.rpm|*amd64.rpm)             new="Analyser_Linux_V${VER}_x64.rpm" ;;
              *) continue ;;
            esac
            [ "$name" = "$new" ] && continue
            # Overwrite-safe: clear any stale asset already holding the target name (a
            # rebuilt tag) so the rename can't fail with 422 already_exists.
            stale=$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$new\") | .id")
            [ -n "$stale" ] && gh api -X DELETE "repos/$REPO/releases/assets/$stale" && echo "cleared stale $new"
            if gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" >/dev/null; then
              echo "renamed $name -> $new"; RENAMES["$name"]="$new"
            else
              echo "rename-fail $name"
            fi
          done <<< "$(list)"

          # 3. Point latest.json at the renamed payloads so auto-update keeps resolving.
          if [ ${#RENAMES[@]} -gt 0 ] && gh release download "$TAG" -p latest.json --dir . --clobber -R "$REPO"; then
            for old in "${!RENAMES[@]}"; do
              sed -i "s#/${old}#/${RENAMES[$old]}#g" latest.json
            done
            gh release upload "$TAG" latest.json --clobber -R "$REPO" && echo "reconciled latest.json"
          fi
