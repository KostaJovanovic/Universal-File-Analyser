# Build + publish a cross-platform native release on every push to main.
#
# What it does per push:
#   * stamps the app version to 0.1.<run-number> (unique + monotonic, so the
#     updater always sees the newest push as "newer"),
#   * builds signed installers for Windows, macOS (Apple Silicon + Intel) and
#     Linux via tauri-action,
#   * publishes them to a GitHub Release tagged v0.1.<run-number>, together with
#     the signed `latest.json` the in-app auto-updater reads.
#
# Manual prerequisites (one time): add repo secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the minisign key that matches the pubkey in
# native/src-tauri/tauri.conf.json). See research/NATIVE-APP-PLAN.md.
#
# Cost note: this runs a full 4-target matrix on EVERY main push. To cut CI
# minutes, either narrow the trigger (e.g. add `paths:` to only build when
# `native/**` or `assets/**` change) or switch to tag-triggered releases
# (`on: push: tags: ['v*']`).

name: release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One release build at a time per branch; a newer push cancels an in-flight one
# so rapid pushes don't pile up or collide on the release tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust_targets: ''
          - platform: macos-latest      # Apple Silicon
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: macos-latest      # Intel
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Cache the Rust build so only changed crates recompile between pushes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target

      # Cache the ~120 MB of CDN WASM that build-dist.mjs vendors, keyed on the
      # script (its pinned URLs), so it's downloaded once, not every run.
      - name: Cache vendored WASM
        uses: actions/cache@v4
        with:
          path: native/.native-cache
          key: native-wasm-${{ hashFiles('native/build-dist.mjs') }}

      - name: Install Tauri CLI
        working-directory: native
        run: npm ci

      - name: Stamp version to 0.1.<run-number>
        shell: bash
        working-directory: native
        run: |
          node -e "const p='src-tauri/tauri.conf.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(p));j.version='0.1.${{ github.run_number }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('version =',j.version)"

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: native
          tagName: v__VERSION__
          releaseName: 'Analyser v__VERSION__'
          releaseBody: 'Automated build. Installed desktop apps auto-update to this release.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
