# Analyser desktop - electron-builder configuration.
#
# Windows, macOS and Linux. .github/workflows/release.yml builds all three on
# GitHub's machines (`electron-builder --win|--mac|--linux --publish never`)
# and puts every file into one GitHub release. `npm run dist` builds the
# Windows installer on this machine.
#
# ONE file per system, on purpose - a release page is for people, not for
# tooling:
#   Analyser-Windows-<version>.exe         installs, OR unpacks a portable
#                                          copy (build/installer.nsh)
#   Analyser-mac-universal-<version>.dmg   Apple silicon and Intel in one app
#   Analyser-linux-x64-<version>.AppImage
# So there is no update file (latest*.yml) and no blockmap: updater.mjs asks
# GitHub's API for the latest release, which gives each download URL and its
# SHA-256 digest. `publish: null` keeps electron-builder from inferring a
# GitHub target from the git remote and writing those files anyway.
#
# The website's own files are NOT bundled into the asar. They ship as
# extraResources, so they land in resources/web/ as ordinary files on disk:
# that keeps net.fetch(pathToFileURL(...)) trivial in main.mjs and sidesteps
# asar quirks around the 72 MB of vendor WASM.
#
# The version is written by tools/stamp-version.mjs from COMMIT_COUNT in
# src/core/app.ts, so the installer and the number in the app's own footer
# always agree. `npm run dist` runs it first.
#
# The file names end in the version (9.9.0, the release tag without its v), so
# a downloaded file says what it is. The apps find their file in a release by
# the part before the version (updater.mjs, AnrUpdate.java), so keep that part
# - "Analyser-Windows", "Analyser-linux-x64" - exactly as it is.

appId: com.valjdakosta.analyser
productName: Analyser
copyright: Kosta Jovanovic

directories:
  output: dist
  buildResources: build

# Only the shell itself goes in the asar.
files:
  - main.mjs
  - router.mjs
  - menu.mjs
  - updater.mjs
  - ffmpeg-native.mjs
  - ffmpeg-accel.mjs
  - preload.cjs
  # The title bar is the window's own page, served from here (main.mjs reads
  # chrome/ out of the asar). Without it a packaged copy has no title bar at
  # all, which is what 9.8 shipped.
  - chrome/**
  - package.json

publish: null

# macOS only: an ad-hoc signature, because there is no Apple certificate yet.
# See the file, and `mac.identity` below.
afterPack: ./tools/after-pack.cjs

extraResources:
  - from: ../web
    to: web
    filter:
      - "**/*"
      # samples/** (18 MB) ships on purpose: the /samples page opens those
      # files, and the Everything offline download lists them.
      # 191 source maps - dev-only, and tsc regenerates them on every build.
      - "!**/*.map"
      # Crawler and deploy plumbing with no meaning off the web.
      - "!sitemap*.xml"
      - "!robots.txt"
      - "!llms.txt"
      - "!_headers"
      # NOTE: formats/** (25 MB of generated /formats/<ext> pages) is kept in
      # on purpose. The /formats hub links straight at them, and a hub full of
      # dead links is a worse trade than the 25 MB.

  # An ffmpeg binary dropped in here ships as resources/ffmpeg/ffmpeg.exe, which
  # is the first path ffmpeg-native.mjs checks - that is how the hardware video
  # path would work on a machine with no ffmpeg installed. Nothing is bundled
  # yet (licensing and roughly 100 MB to decide on), so the app uses the one on
  # PATH and falls back to the WASM build when there is none. The entry is
  # commented out rather than deleted so the slot is obvious.
  # - from: ffmpeg
  #   to: ffmpeg

win:
  target:
    - target: nsis
      arch: [x64]
  # A hand-built .ico, drawn afresh at every size from 16 to 256 px, so the
  # thin strokes stay sharp (tools/make-icon.mjs). Converting icon.png made
  # the small sizes soft.
  icon: build/icon.ico
  # Unsigned for now. Windows SmartScreen will warn on first run until a
  # certificate is in place - see the note in README.md.

nsis:
  # The first page asks: install, or a portable copy in a folder. The portable
  # copy writes portable.txt beside Analyser.exe, which main.mjs reads to keep
  # every setting in Analyser-data there. See build/installer.nsh.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  # No folder page: an install goes to the usual per-user folder, and page 1
  # of installer.nsh picks the portable folder itself. installer.nsh stops the
  # build if this is turned back on.
  allowToChangeInstallationDirectory: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Analyser
  artifactName: Analyser-Windows-${version}.${ext}
  uninstallDisplayName: Analyser
  # No .blockmap. updater.mjs downloads the whole installer, which is simpler
  # than a patch and keeps the release to one Windows file.
  differentialPackage: false

mac:
  target:
    - target: dmg
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.utilities
  artifactName: Analyser-mac-universal-${version}.${ext}
  # No Apple Developer ID yet. null makes electron-builder skip signing, and
  # tools/after-pack.cjs signs ad-hoc instead. Remove both once a certificate
  # exists: notarisation becomes possible then, and so do installed updates.
  identity: null

dmg:
  # No .dmg.blockmap: nothing reads it.
  writeUpdateInfo: false

linux:
  target:
    # Runs on nearly every distribution, and updates itself (updater.mjs).
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility
  # Without this the binary takes the npm package name, analyser-desktop.
  executableName: analyser
  synopsis: Drop a file and see what it is. Nothing leaves your computer.
  artifactName: Analyser-linux-x64-${version}.${ext}

# File associations are deliberately absent. Claiming .pdf or .jpg on install
# would be hostile, and the format catalog is far too broad to register wholesale.
