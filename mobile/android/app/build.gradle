apply plugin: 'com.android.application'

android {
    namespace = "com.valjdakosta.analyser"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.valjdakosta.analyser"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 305
        versionName "9.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The update feed AnrUpdate.java reads. Empty means no update check at
        // all, and it stays empty unless the build passes -PanrUpdateFeed=<url>.
        // Only .github/workflows/release.yml does, so a mobile.bat build never
        // checks. A Google Play build must not pass it: Play forbids an app
        // that updates itself.
        buildConfigField "String", "UPDATE_FEED", "\"${project.findProperty('anrUpdateFeed') ?: ''}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // The release key. The release workflow writes the keystore from the
    // repository secrets and names it in ANR_KEYSTORE. Without that variable a
    // release build comes out unsigned, and a debug build keeps the debug key.
    // Keep the SAME keystore forever: Android refuses an update signed with
    // another key, so a new one would strand every installed copy.
    signingConfigs {
        release {
            def keystore = System.getenv('ANR_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ANR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANR_KEY_ALIAS')
                // One password for the store and the key, unless a second is set.
                keyPassword System.getenv('ANR_KEY_PASSWORD') ?: System.getenv('ANR_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANR_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Native FFmpeg ships as jniLibs/<abi>/libanrffmpeg.so, an executable with a
    // library's name (see AnrFfmpeg.java). It must be EXTRACTED to the native
    // library folder at install - the one place an app may execute a file from
    // since targetSdk 29 - and modern packaging would leave it inside the APK.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WebMessageListener (the byte channel) and document-start scripts (the bridge).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
